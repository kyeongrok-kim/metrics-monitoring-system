services:
  influxdb:
    image: influxdb:2.7
    container_name: metrics-influxdb
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: study
      DOCKER_INFLUXDB_INIT_BUCKET: metrics_raw   # 원본: 7일 보관 (책 161p)
      DOCKER_INFLUXDB_INIT_RETENTION: 7d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: study-token
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d
      - ./docker/tasks:/tasks
